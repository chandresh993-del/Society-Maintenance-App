<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0A1F44">
<title>Society Maintenance</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f5f9;color:#1b2333;font-size:14px}
.hdr{background:#0A1F44;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t span{font-size:11px;opacity:.8}
.hdr button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #dde2ea;position:sticky;top:52px;z-index:4}
.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 12px;font-size:13px;color:#56617a;border-bottom:3px solid transparent}
.tabs button.on{color:#0A1F44;font-weight:600;border-bottom-color:#F2A900}
.wrap{padding:10px;max-width:900px;margin:0 auto}
.card{background:#fff;border:1px solid #e1e5ec;border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:#0A1F44}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid #e1e5ec;border-radius:8px;padding:8px 10px}
.kpi small{color:#6b7488;font-size:11px;display:block}
.kpi b{font-size:17px}
.kpi.hl{background:#0A1F44;color:#fff;border-color:#0A1F44}.kpi.hl small{color:#F2A900}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef1f6;text-align:left;padding:6px;font-size:12px;color:#3c4760;white-space:nowrap}
td{padding:6px;border-top:1px solid #edf0f4;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#fafbfd}
.tw{overflow-x:auto}
label{display:block;font-size:12px;color:#56617a;margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid #c9d0db;border-radius:6px;font-size:14px;background:#fff;font-family:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{border:1px solid #c9d0db;background:#fff;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.pri{background:#0A1F44;color:#fff;border-color:#0A1F44}
.btn.amb{background:#F2A900;color:#0A1F44;border-color:#F2A900;font-weight:600}
.btn.red{color:#c0392b;border-color:#e3b3ad}
.btn.wa{background:#25D366;color:#fff;border-color:#25D366}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.big{width:100%;padding:11px;font-size:15px;margin-top:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #c9d0db;border-radius:16px;padding:6px 10px;font-size:12px;background:#fff}
.chip.on{background:#0A1F44;color:#fff;border-color:#0A1F44}
.chip.paid{background:#e4f5ea;color:#1e7c43;border-color:#b6e0c4}
.muted{color:#6b7488}.small{font-size:11px}
.ok{color:#1e7c43;font-weight:600}.due{color:#c0392b;font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#eef1f6}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:640px){.grid12{grid-template-columns:repeat(6,1fr)}}
.mcell{border-radius:6px;padding:6px;text-align:center;font-size:12px;border:1px solid #e1e5ec}
.mcell.p{background:#e4f5ea;border-color:#b6e0c4}.mcell.d{background:#fdecea;border-color:#f3c2bc}.mcell.n{background:#f6f7f9;color:#a0a7b5}
.cbar{height:8px;background:#F2A900;border-radius:4px}
.login{max-width:380px;margin:30px auto;background:#fff;border-radius:10px;padding:20px;border:1px solid #e1e5ec;text-align:center}
.login label,.login input,.login select{text-align:left}
.login h2{margin:6px 0 2px;color:#0A1F44;font-size:18px}
.seg{display:flex;margin:14px 0 4px;border:1px solid #0A1F44;border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;padding:8px;background:#fff;color:#0A1F44;font-size:13px}
.seg button.on{background:#0A1F44;color:#fff}
#ov{position:fixed;inset:0;background:rgba(10,31,68,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov.on{display:flex}
#ov .box{background:#fff;border-radius:10px;padding:16px;max-width:420px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;display:none;z-index:60}
.foot{text-align:center;font-size:11px;color:#98a0b0;padding:16px}
@media print{.hdr button,.tabs,.bar,.noprint,.foot{display:none!important}.hdr{position:static}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div class="box" id="ovb"></div></div>
<div id="toast"></div>
<script>
/* ===================== CLOUD SETTINGS =====================
   Fill these 2 values from your Firebase project
   (Project settings > General > Web API key & Project ID).
   Leave empty = app works only on this device (local mode). */
const FB = { projectId: "society-maintenance-19c4b", apiKey: "AIzaSyCR8Dw0iQVOJcw6NvjFmXUdWjXGfqIwZLc" };
/* ========================================================== */

const LSK = "socMaint_v1";
const CATS = ["Watchman / Security","Housekeeping / Cleaning","Electricity (Common)","Water Supply","Lift Maintenance","Repairs & Maintenance","Garden","Pest Control","Office / Stationery","Bank Charges","Other"];
const MODES = ["Cash","UPI","Cheque","Bank Transfer"];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => { const v = Math.round(+n || 0); return (v < 0 ? "-₹" : "₹") + Math.abs(v).toLocaleString("en-IN"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const curYM = () => today().slice(0, 7);
const ymL = ym => ym ? MN[+ym.slice(5) - 1] + " " + ym.slice(2, 4) : "";
const dL = d => d ? d.slice(8, 10) + "-" + MN[+d.slice(5, 7) - 1] + "-" + d.slice(2, 4) : "";
const sum = a => a.reduce((s, x) => s + (+x.amount || 0), 0);
const digits = s => String(s || "").replace(/\D/g, "");
function monthsBetween(a, b) { const out = []; if (!a || !b || a > b) return out; let [y, m] = a.split("-").map(Number); const [by, bm] = b.split("-").map(Number); while (y < by || (y === by && m <= bm)) { out.push(y + "-" + String(m).padStart(2, "0")); m++; if (m > 12) { m = 1; y++; } } return out; }
const byNo = (a, b) => String(a.no).localeCompare(String(b.no), undefined, { numeric: true });

/* ---------- data ---------- */
function blank() { return { settings: { name: "My Flat Scheme Co-op Housing Society", address: "", regNo: "", openingBalance: 0, start: curYM(), adminPin: "1234", cats: CATS.slice(), ts: 0 }, flats: [], payments: [], expenses: [], notices: [], updatedAt: 0 }; }
function loadLocal() { try { const x = JSON.parse(localStorage.getItem(LSK)); if (x && x.settings) return x; } catch (e) {} return null; }
function saveLocal() { try { localStorage.setItem(LSK, JSON.stringify(D)); } catch (e) {} }
let D = loadLocal() || blank();
const L = k => (D[k] || []).filter(x => !x.del);
const flatById = id => D.flats.find(f => f.id === id);
const cats = () => (D.settings.cats && D.settings.cats.length) ? D.settings.cats : CATS;

function merge(a, b) {
  const o = blank();
  for (const k of ["flats", "payments", "expenses", "notices"]) {
    const m = new Map();
    for (const x of (a[k] || [])) m.set(x.id, x);
    for (const x of (b[k] || [])) { const y = m.get(x.id); if (!y || (x.ts || 0) >= (y.ts || 0)) m.set(x.id, x); }
    o[k] = [...m.values()];
  }
  o.settings = Object.assign(blank().settings, ((b.settings?.ts || 0) >= (a.settings?.ts || 0)) ? b.settings : a.settings);
  o.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return o;
}

/* ---------- cloud sync (Firestore REST, one document) ---------- */
const cloudOn = () => !!(FB.projectId && FB.apiKey);
const docURL = () => `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/society/data?key=${FB.apiKey}`;
let SY = { st: cloudOn() ? "busy" : "local", at: null };
async function pull() {
  if (!cloudOn()) return;
  const r = await fetch(docURL());
  if (r.status === 404) return;
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const s = j.fields && j.fields.json && j.fields.json.stringValue;
  if (s) { D = merge(D, JSON.parse(s)); saveLocal(); }
}
async function push(overwrite) {
  saveLocal();
  if (!cloudOn()) { SY.st = "local"; drawSync(); return; }
  SY.st = "busy"; drawSync();
  try {
    if (!overwrite) await pull();
    const r = await fetch(docURL(), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: { json: { stringValue: JSON.stringify(D) } } }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    SY = { st: "ok", at: new Date() };
  } catch (e) { SY = { st: "err", at: null, msg: e.message }; }
  drawSync();
}
async function refresh(show) {
  if (!cloudOn()) { if (show) toast("Local mode — cloud not set up"); return; }
  SY.st = "busy"; drawSync();
  try { await pull(); SY = { st: "ok", at: new Date() }; if (show) toast("Updated"); }
  catch (e) { SY = { st: "err", msg: e.message }; if (show) toast("Could not reach cloud"); }
  render();
}
function syncText() {
  if (SY.st === "local") return "📱 Local mode (this device only)";
  if (SY.st === "busy") return "⏳ Syncing…";
  if (SY.st === "err") return "⚠️ Offline — showing saved data";
  return "☁️ Synced " + (SY.at ? SY.at.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "");
}
function drawSync() { const e = $("#sy"); if (e) e.textContent = syncText(); }
/* ---------- photos (each photo = its own cloud document, so main data stays small) ---------- */
const PHC = {};
const phURL = id => `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/photos/${id}?key=${FB.apiKey}`;
function compressImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      let q = 0.65, max = 1100, out;
      for (let i = 0; i < 4; i++) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 600000) break;
        q -= 0.15; max -= 250;
      }
      URL.revokeObjectURL(u); res(out);
    };
    img.onerror = () => rej(new Error("Not an image"));
    img.src = u;
  });
}
async function putPhoto(id, data) {
  PHC[id] = data;
  if (cloudOn()) {
    const r = await fetch(phURL(id), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: { data: { stringValue: data } } }) });
    if (!r.ok) throw new Error("Upload failed (HTTP " + r.status + ")");
  } else {
    try { localStorage.setItem("socPh_" + id, data); } catch (e) { throw new Error("Phone storage full — set up cloud for photos"); }
  }
}
async function getPhoto(id) {
  if (PHC[id]) return PHC[id];
  let d = null; try { d = localStorage.getItem("socPh_" + id); } catch (e) {}
  if (!d && cloudOn()) { const r = await fetch(phURL(id)); if (r.ok) { const j = await r.json(); d = j.fields && j.fields.data && j.fields.data.stringValue; } }
  if (d) PHC[id] = d;
  return d;
}
function dropPhoto(id) { if (!id) return; delete PHC[id]; try { localStorage.removeItem("socPh_" + id); } catch (e) {} if (cloudOn()) fetch(phURL(id), { method: "DELETE" }).catch(() => {}); }
let UPL = false;
const FORMS = { get EF() { return EF; }, get NF() { return NF; } };
async function pickPhoto(inp, form) {
  const file = inp.files[0]; inp.value = ""; if (!file) return;
  UPL = true; render();
  try {
    const data = await compressImg(file), id = "ph" + uid();
    await putPhoto(id, data);
    FORMS[form].photo = id; toast("Photo attached");
  } catch (e) { toast(e.message); }
  UPL = false; render();
}
function photoField(form) {
  const F = FORMS[form];
  return `<label>Photo (bill / notice image) — optional</label>
    ${F.photo ? `<div class="bar"><button class="btn sm" onclick="viewPhoto('${F.photo}')">📎 View photo</button><button class="btn sm red" onclick="${form}.photo='';render()">Remove</button></div>`
      : UPL ? `<div class="muted small">⏳ Uploading photo…</div>`
      : `<div class="bar"><button class="btn sm" onclick="$('#ph_cam').click()">📷 Camera</button><button class="btn sm" onclick="$('#ph_gal').click()">🖼 Gallery</button></div>
         <input type="file" id="ph_cam" accept="image/*" capture="environment" style="display:none" onchange="pickPhoto(this,'${form}')">
         <input type="file" id="ph_gal" accept="image/*" style="display:none" onchange="pickPhoto(this,'${form}')">`}`;
}
async function viewPhoto(id) {
  $("#ovb").innerHTML = `<div class="muted">⏳ Loading photo…</div>`; $("#ov").classList.add("on");
  let d = null; try { d = await getPhoto(id); } catch (e) {}
  $("#ovb").innerHTML = d ? `<img src="${d}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:6px"><div class="row" style="margin-top:10px"><button class="btn" onclick="sharePhoto('${id}')">📤 Share</button><button class="btn pri" onclick="closeOv()">Close</button></div>`
    : `<div>Photo not available (check internet).</div><button class="btn pri big" onclick="closeOv()">Close</button>`;
}
async function sharePhoto(id) {
  const d = await getPhoto(id); if (!d) return;
  const blob = await (await fetch(d)).blob(), file = new File([blob], "society_photo.jpg", { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch (e) {} }
  else { const a = document.createElement("a"); a.href = d; a.download = "society_photo.jpg"; a.click(); }
}

function commit(msg) { D.updatedAt = Date.now(); saveLocal(); render(); if (msg) toast(msg); push(); }

/* ---------- UI helpers ---------- */
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 2200); }
function ask(msg, okLabel, cb, danger) {
  $("#ovb").innerHTML = `<div style="margin-bottom:14px">${msg}</div><div class="row"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn ${danger ? "red" : "pri"}" id="ovok">${esc(okLabel)}</button></div>`;
  $("#ov").classList.add("on");
  $("#ovok").onclick = () => { closeOv(); cb(); };
}
function closeOv() { $("#ov").classList.remove("on"); }
function openWA(mobile, text) {
  let m = digits(mobile); if (m.length === 10) m = "91" + m;
  window.open("https://wa.me/" + m + "?text=" + encodeURIComponent(text), "_blank");
}
function download(name, text, type) {
  const b = new Blob([text], { type: type || "text/plain" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvCell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
function downloadCSV(name, rows) { download(name, "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"), "text/csv"); }

/* ---------- business logic ---------- */
function paidSet(flatId) { const s = new Set(); L("payments").forEach(p => { if (p.flatId === flatId && p.type !== "O") (p.months || []).forEach(m => s.add(m)); }); return s; }
function duesOf(f) {
  const start = f.start || D.settings.start || curYM();
  const paid = paidSet(f.id);
  const months = monthsBetween(start, curYM()).filter(m => !paid.has(m));
  return { months, amount: months.length * (+f.amt || 0) };
}
function totals() {
  const P = L("payments"), E = L("expenses"), ob = +D.settings.openingBalance || 0;
  const col = sum(P), sp = sum(E);
  return { ob, col, sp, bal: ob + col - sp };
}
function nextRno() { let mx = 0; D.payments.forEach(p => { const n = parseInt(String(p.rno || "").replace(/\D/g, "")) || 0; if (n > mx) mx = n; }); return "R-" + String(mx + 1).padStart(4, "0"); }
const ownerPin = f => f.pin || digits(f.mobile).slice(-4);

/* ---------- session ---------- */
let S = null; try { S = JSON.parse(sessionStorage.getItem("socS")); } catch (e) {}
let TAB = (S && S.tab) || "dash", LM = "o";
function setTab(t) { TAB = t; if (t === "notice" && S && S.role === "owner") { try { localStorage.setItem(seenKey(), String(Date.now())); } catch (e) {} } if (S) { S.tab = t; sessionStorage.setItem("socS", JSON.stringify(S)); } render(); window.scrollTo(0, 0); }
function doLogin() {
  const pin = $("#lp").value.trim();
  if (LM === "a") {
    if (pin !== String(D.settings.adminPin || "1234")) return toast("Wrong committee PIN");
    S = { role: "admin" };
  } else {
    const f = flatById($("#lf").value);
    if (!f) return toast("Select your flat");
    if (!ownerPin(f) || pin !== String(ownerPin(f))) return toast("Wrong PIN");
    S = { role: "owner", flatId: f.id };
  }
  S.tab = "dash"; TAB = "dash"; sessionStorage.setItem("socS", JSON.stringify(S)); render();
}
function logout() { S = null; LM = "o"; sessionStorage.removeItem("socS"); render(); }

/* ---------- views ---------- */
function render() {
  const app = $("#app");
  if (S && S.role === "owner" && !flatById(S.flatId)) S = null;
  if (!S) { app.innerHTML = loginView(); return; }
  const admin = S.role === "admin";
  const tabs = admin
    ? [["dash", "🏠 Home"], ["collect", "💰 Collect"], ["exp", "🧾 Expenses"], ["notice", "📢 Notices"], ["dues", "⏳ Dues"], ["flats", "🏢 Flats"], ["rep", "📊 Reports"], ["set", "⚙️ Settings"]]
    : [["dash", "🏠 Home"], ["notice", "📢 Notices" + (unread() ? ` <span class="pill" style="background:#F2A900;color:#0A1F44">${unread()}</span>` : "")], ["mine", "💳 My Payments"], ["exp", "🧾 Expenses"], ["rep", "📊 Reports"]];
  if (!tabs.some(t => t[0] === TAB)) TAB = "dash";
  const who = admin ? "Committee" : "Flat " + esc(flatById(S.flatId).no);
  const V = { dash: dashView, collect: collectView, exp: expView, dues: duesView, flats: flatsView, rep: repView, set: setView, mine: mineView, notice: noticeView }[TAB];
  app.innerHTML = `<div class="hdr"><div class="t"><b>${esc(D.settings.name)}</b><span>${who} · <span id="sy">${syncText()}</span></span></div>
    <button onclick="refresh(true)">⟳</button><button onclick="logout()">Logout</button></div>
    <div class="tabs">${tabs.map(t => `<button class="${t[0] === TAB ? "on" : ""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</div>
    <div class="wrap">${V()}</div><div class="foot">Society Maintenance App · Powered by ENTRIX Innovation</div>`;
}

function loginView() {
  const flats = L("flats").sort(byNo);
  return `<div class="login"><div style="font-size:40px">🏢</div><h2>${esc(D.settings.name)}</h2>
  <div class="muted">Maintenance collection & expense register</div>
  <div class="seg"><button class="${LM === "o" ? "on" : ""}" onclick="LM='o';render()">Flat Owner</button><button class="${LM === "a" ? "on" : ""}" onclick="LM='a';render()">Committee</button></div>
  ${LM === "o" ? `<label>Flat No.</label><select id="lf">${flats.length ? flats.map(f => `<option value="${f.id}">${esc(f.no)}</option>`).join("") : `<option value="">No flats added yet</option>`}</select>` : ""}
  <label>${LM === "o" ? "PIN (last 4 digits of your registered mobile)" : "Committee PIN"}</label>
  <input id="lp" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn pri big" onclick="doLogin()">Login</button>
  <div class="muted small" style="margin-top:12px">${syncText()}</div></div>
  <div class="foot">Powered by ENTRIX Innovation</div>`;
}

function kpis() {
  const t = totals(), ym = curYM();
  const cm = sum(L("payments").filter(p => (p.date || "").slice(0, 7) === ym));
  const em = sum(L("expenses").filter(e => (e.date || "").slice(0, 7) === ym));
  return `<div class="kpis">
    <div class="kpi hl"><small>Balance with Society</small><b>${inr(t.bal)}</b></div>
    <div class="kpi"><small>Total Collected</small><b class="ok">${inr(t.col)}</b></div>
    <div class="kpi"><small>Total Spent</small><b class="due">${inr(t.sp)}</b></div>
    <div class="kpi"><small>${ymL(ym)}: In / Out</small><b style="font-size:14px">${inr(cm)} / ${inr(em)}</b></div></div>
    ${t.ob ? `<div class="muted small" style="margin:-4px 0 8px">Includes opening balance ${inr(t.ob)}</div>` : ""}`;
}

function expTable(list, withActions) {
  if (!list.length) return `<div class="muted">No expenses recorded.</div>`;
  return `<div class="tw"><table><thead><tr><th>Date</th><th>Work / Description</th><th>Paid To</th><th class="r">Amount</th>${withActions ? "<th></th>" : ""}</tr></thead><tbody>
  ${list.map(e => `<tr><td>${dL(e.date)}</td><td><b>${esc(e.desc || e.cat)}</b><br><span class="pill">${esc(e.cat)}</span> <span class="muted small">${esc(e.mode)}${e.ref ? " · " + esc(e.ref) : ""}</span>${e.photo ? ` <button class="btn sm" onclick="viewPhoto('${e.photo}')">📎 Bill</button>` : ""}</td><td>${esc(e.payee)}</td><td class="r">${inr(e.amount)}</td>
  ${withActions ? `<td class="r"><button class="btn sm" onclick="editExp('${e.id}')">Edit</button> <button class="btn sm red" onclick="delExp('${e.id}')">✕</button></td>` : ""}</tr>`).join("")}
  </tbody><tfoot><tr><td colspan="3">Total (${list.length})</td><td class="r">${inr(sum(list))}</td>${withActions ? "<td></td>" : ""}</tr></tfoot></table></div>`;
}
const sortDesc = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.ts || 0) - (a.ts || 0);

function dashView() {
  const nl = noticeList().slice(0, 2);
  let h = nl.length ? `<div class="card" style="border-left:4px solid #F2A900"><h3>📢 Latest Notices</h3>${nl.map(n => `<div style="margin-bottom:8px"><b>${n.pin ? "📌 " : ""}${esc(n.title)}</b> <span class="muted small">${dL(n.date)}</span><div class="small" style="white-space:pre-wrap">${esc(n.body.length > 160 ? n.body.slice(0, 160) + "…" : n.body)}</div></div>`).join("")}<button class="btn sm" onclick="setTab('notice')">All notices →</button></div>` : "";
  h += kpis();
  if (S.role === "owner") {
    const f = flatById(S.flatId), d = duesOf(f);
    h += `<div class="card"><h3>My Maintenance — Flat ${esc(f.no)}</h3>
      <div>${esc(f.owner)} · ${inr(f.amt)}/month</div>
      ${d.months.length ? `<div class="due" style="margin-top:6px">Pending ${d.months.length} month(s): ${inr(d.amount)}</div><div class="muted small">${d.months.map(ymL).join(", ")}</div>` : `<div class="ok" style="margin-top:6px">✓ All dues paid up to ${ymL(curYM())}</div>`}
      <div class="bar"><button class="btn sm" onclick="setTab('mine')">View my receipts →</button></div></div>`;
  } else {
    const fl = L("flats"); let pend = 0, cnt = 0;
    fl.forEach(f => { const d = duesOf(f); if (d.amount > 0) { pend += d.amount; cnt++; } });
    h += `<div class="card"><h3>Dues Position</h3><div>${fl.length} flats · <span class="due">${cnt} with pending dues · ${inr(pend)}</span></div>
      <div class="bar"><button class="btn sm amb" onclick="setTab('collect')">+ Collect Payment</button><button class="btn sm" onclick="setTab('exp')">+ Add Expense</button><button class="btn sm" onclick="setTab('dues')">See Dues</button></div></div>`;
  }
  h += `<div class="card"><h3>Where society money was spent (latest)</h3>${expTable(L("expenses").sort(sortDesc).slice(0, 8), false)}
    <div class="bar"><button class="btn sm" onclick="setTab('exp')">All expenses →</button></div></div>`;
  return h;
}

/* ----- My payments (owner) ----- */
let MY = new Date().getFullYear();
function mineView() {
  const f = flatById(S.flatId), paid = paidSet(f.id), start = f.start || D.settings.start, cy = curYM();
  const P = L("payments").filter(p => p.flatId === f.id).sort(sortDesc);
  const years = new Set([new Date().getFullYear()]); P.forEach(p => (p.months || []).forEach(m => years.add(+m.slice(0, 4)))); if (start) years.add(+start.slice(0, 4));
  let g = "";
  for (let i = 1; i <= 12; i++) {
    const ym = MY + "-" + String(i).padStart(2, "0");
    const cls = paid.has(ym) ? "p" : (ym >= start && ym <= cy ? "d" : "n");
    g += `<div class="mcell ${cls}"><b>${MN[i - 1]}</b><br>${cls === "p" ? "✓ Paid" : cls === "d" ? "Due" : "—"}</div>`;
  }
  return `<div class="card"><h3>Flat ${esc(f.no)} · ${esc(f.owner)}</h3>
    <div class="bar"><label style="margin:0">Year</label><select style="width:auto" onchange="MY=+this.value;render()">${[...years].sort().map(y => `<option ${y === MY ? "selected" : ""}>${y}</option>`).join("")}</select></div>
    <div class="grid12">${g}</div></div>
    <div class="card"><h3>My Receipts</h3>${P.length ? `<div class="tw"><table><thead><tr><th>Receipt</th><th>Date</th><th>For</th><th class="r">Amount</th></tr></thead><tbody>
    ${P.map(p => `<tr><td>${esc(p.rno)}</td><td>${dL(p.date)}</td><td>${p.type === "O" ? esc(p.note) : (p.months || []).map(ymL).join(", ")}<br><span class="muted small">${esc(p.mode)}${p.ref ? " · " + esc(p.ref) : ""}</span></td><td class="r">${inr(p.amount)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="3">Total paid</td><td class="r">${inr(sum(P))}</td></tr></tfoot></table></div>` : `<div class="muted">No payments yet.</div>`}</div>`;
}

/* ----- Collect (admin) ----- */
let CF = null;
function newCF() { const f = L("flats").sort(byNo)[0]; return { id: null, type: "M", flatId: f ? f.id : "", year: new Date().getFullYear(), months: [], amount: "", date: today(), mode: "UPI", ref: "", note: "" }; }
let PF = { m: "" };
function collectView() {
  if (!CF) CF = newCF();
  const flats = L("flats").sort(byNo);
  if (!flats.length) return `<div class="card">Add flats first in the <b>Flats</b> tab.<div class="bar"><button class="btn pri" onclick="setTab('flats')">Go to Flats</button></div></div>`;
  const f = flatById(CF.flatId);
  const editing = CF.id ? D.payments.find(p => p.id === CF.id) : null;
  const paid = f ? paidSet(f.id) : new Set();
  if (editing) (editing.months || []).forEach(m => paid.delete(m));
  let chips = "";
  if (CF.type === "M" && f) {
    for (let i = 1; i <= 12; i++) {
      const ym = CF.year + "-" + String(i).padStart(2, "0");
      if (paid.has(ym)) chips += `<span class="chip paid">${MN[i - 1]} ✓</span>`;
      else chips += `<button class="chip ${CF.months.includes(ym) ? "on" : ""}" onclick="cfMonth('${ym}')">${MN[i - 1]}</button>`;
    }
  }
  const d = f ? duesOf(f) : null;
  let list = L("payments").sort(sortDesc);
  if (PF.m) list = list.filter(p => (p.date || "").slice(0, 7) === PF.m);
  const pm = [...new Set(L("payments").map(p => (p.date || "").slice(0, 7)))].sort().reverse();
  return `<div class="card"><h3>${editing ? "Edit Receipt " + esc(editing.rno) : "Collect Payment"}</h3>
    <div class="seg" style="margin-top:0"><button class="${CF.type === "M" ? "on" : ""}" onclick="CF.type='M';render()">Maintenance</button><button class="${CF.type === "O" ? "on" : ""}" onclick="CF.type='O';CF.months=[];render()">Other Income</button></div>
    <label>Flat ${CF.type === "O" ? "(optional)" : ""}</label>
    <select onchange="CF.flatId=this.value;CF.months=[];cfAuto();render()">${CF.type === "O" ? `<option value="">— None —</option>` : ""}${flats.map(x => `<option value="${x.id}" ${x.id === CF.flatId ? "selected" : ""}>${esc(x.no)} — ${esc(x.owner)}</option>`).join("")}</select>
    ${CF.type === "M" && f ? `<div class="muted small" style="margin-top:4px">${inr(f.amt)}/month · ${d.months.length ? `<span class="due">Pending: ${d.months.map(ymL).join(", ")}</span>` : `<span class="ok">No dues</span>`}</div>
      <div class="bar"><label style="margin:0">Year</label><select style="width:auto" onchange="CF.year=+this.value;render()">${[-2, -1, 0, 1].map(o => { const y = new Date().getFullYear() + o; return `<option ${y === CF.year ? "selected" : ""}>${y}</option>`; }).join("")}</select>
      ${d.months.length ? `<button class="btn sm" onclick="CF.months=duesOf(flatById(CF.flatId)).months;cfAuto();render()">Select all pending</button>` : ""}</div>
      <div class="chips">${chips}</div>
      <div class="muted small" style="margin-top:4px">Selected: ${CF.months.length ? CF.months.sort().map(ymL).join(", ") : "none"}</div>` : ""}
    ${CF.type === "O" ? `<label>Income description</label><input value="${esc(CF.note)}" oninput="CF.note=this.value" placeholder="e.g. Late fee, Hall rent, Bank interest">` : ""}
    <div class="row"><div><label>Amount ₹</label><input id="cfa" inputmode="decimal" value="${esc(CF.amount)}" oninput="CF.amount=this.value"></div><div><label>Date</label><input type="date" value="${CF.date}" onchange="CF.date=this.value"></div></div>
    <div class="row"><div><label>Mode</label><select onchange="CF.mode=this.value">${MODES.map(m => `<option ${m === CF.mode ? "selected" : ""}>${m}</option>`).join("")}</select></div><div><label>UTR / Cheque No.</label><input value="${esc(CF.ref)}" oninput="CF.ref=this.value"></div></div>
    ${CF.type === "M" ? `<label>Note (optional)</label><input value="${esc(CF.note)}" oninput="CF.note=this.value">` : ""}
    <div class="row" style="margin-top:12px">${editing ? `<button class="btn" onclick="CF=newCF();render()">Cancel</button>` : ""}<button class="btn amb" onclick="savePay()">${editing ? "Update" : "Save Receipt"}</button></div></div>
    <div class="card"><h3>Receipts</h3>
    <div class="bar"><select style="width:auto" onchange="PF.m=this.value;render()"><option value="">All months</option>${pm.map(m => `<option value="${m}" ${m === PF.m ? "selected" : ""}>${ymL(m)}</option>`).join("")}</select></div>
    ${list.length ? `<div class="tw"><table><thead><tr><th>Rcpt</th><th>Date</th><th>Flat / For</th><th class="r">Amount</th><th></th></tr></thead><tbody>
    ${list.map(p => { const fl = flatById(p.flatId); return `<tr><td>${esc(p.rno)}</td><td>${dL(p.date)}</td><td><b>${fl ? esc(fl.no) : "—"}</b> ${fl ? esc(fl.owner) : ""}<br><span class="muted small">${p.type === "O" ? "Other: " + esc(p.note) : (p.months || []).map(ymL).join(", ")} · ${esc(p.mode)}</span></td><td class="r">${inr(p.amount)}</td>
      <td class="r" style="white-space:nowrap">${fl && fl.mobile ? `<button class="btn sm wa" onclick="waReceipt('${p.id}')">WA</button> ` : ""}<button class="btn sm" onclick="editPay('${p.id}')">Edit</button> <button class="btn sm red" onclick="delPay('${p.id}')">✕</button></td></tr>`; }).join("")}
    </tbody><tfoot><tr><td colspan="3">Total (${list.length})</td><td class="r">${inr(sum(list))}</td><td></td></tr></tfoot></table></div>` : `<div class="muted">No receipts yet.</div>`}</div>`;
}
function cfAuto() { const f = flatById(CF.flatId); if (CF.type === "M" && f) CF.amount = CF.months.length ? String(CF.months.length * (+f.amt || 0)) : ""; }
function cfMonth(ym) { const i = CF.months.indexOf(ym); if (i >= 0) CF.months.splice(i, 1); else CF.months.push(ym); cfAuto(); render(); }
function savePay() {
  const amt = +CF.amount;
  if (CF.type === "M" && !CF.flatId) return toast("Select flat");
  if (CF.type === "M" && !CF.months.length) return toast("Select month(s)");
  if (CF.type === "O" && !CF.note.trim()) return toast("Enter income description");
  if (!(amt > 0)) return toast("Enter amount");
  if (!CF.date) return toast("Enter date");
  const rec = { id: CF.id || uid(), type: CF.type, flatId: CF.flatId || "", months: CF.type === "M" ? CF.months.slice().sort() : [], amount: amt, date: CF.date, mode: CF.mode, ref: CF.ref.trim(), note: CF.note.trim(), ts: Date.now() };
  if (CF.id) { const old = D.payments.find(p => p.id === CF.id); rec.rno = old.rno; Object.assign(old, rec); }
  else { rec.rno = nextRno(); D.payments.push(rec); }
  const isNew = !CF.id, fl = flatById(rec.flatId);
  CF = newCF(); CF.flatId = rec.flatId || CF.flatId;
  commit((isNew ? "Saved " : "Updated ") + rec.rno);
  if (isNew && fl && fl.mobile) ask(`Receipt <b>${esc(rec.rno)}</b> saved for Flat ${esc(fl.no)} — ${inr(rec.amount)}.<br><br>Send receipt on WhatsApp to ${esc(fl.owner)}?`, "Send on WhatsApp", () => waReceipt(rec.id));
}
function editPay(id) { const p = D.payments.find(x => x.id === id); CF = { id, type: p.type || "M", flatId: p.flatId, year: +((p.months && p.months[0]) || p.date).slice(0, 4), months: (p.months || []).slice(), amount: String(p.amount), date: p.date, mode: p.mode, ref: p.ref || "", note: p.note || "" }; render(); window.scrollTo(0, 0); }
function delPay(id) { const p = D.payments.find(x => x.id === id); ask(`Delete receipt <b>${esc(p.rno)}</b> (${inr(p.amount)})?`, "Delete", () => { p.del = true; p.ts = Date.now(); commit("Deleted"); }, true); }
function waReceipt(id) {
  const p = D.payments.find(x => x.id === id), f = flatById(p.flatId), s = D.settings;
  const t = `*${s.name}*\nMaintenance Receipt *${p.rno}*\n\nFlat: ${f.no}\nName: ${f.owner}\nFor: ${p.type === "O" ? p.note : (p.months || []).map(ymL).join(", ")}\nAmount: ${inr(p.amount)}\nDate: ${dL(p.date)}\nMode: ${p.mode}${p.ref ? " (" + p.ref + ")" : ""}\n\nThank you.\nSee all payments & society expenses in the app.`;
  openWA(f.mobile, t);
}

/* ----- Expenses ----- */
let EF = null, XF = { m: "", c: "" };
function newEF() { return { id: null, date: today(), cat: cats()[0], desc: "", payee: "", amount: "", mode: "Cash", ref: "", photo: "" }; }
function expView() {
  const admin = S.role === "admin";
  if (admin && !EF) EF = newEF();
  let list = L("expenses").sort(sortDesc);
  const ms = [...new Set(list.map(e => (e.date || "").slice(0, 7)))].sort().reverse();
  if (XF.m) list = list.filter(e => (e.date || "").slice(0, 7) === XF.m);
  if (XF.c) list = list.filter(e => e.cat === XF.c);
  let form = "";
  if (admin) form = `<div class="card"><h3>${EF.id ? "Edit Expense" : "Add Expense (work paid from society fund)"}</h3>
    <div class="row"><div><label>Date</label><input type="date" value="${EF.date}" onchange="EF.date=this.value"></div><div><label>Category</label><select onchange="EF.cat=this.value">${cats().map(c => `<option ${c === EF.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div></div>
    <label>Work done / Description</label><input value="${esc(EF.desc)}" oninput="EF.desc=this.value" placeholder="e.g. Water tank cleaning, Nov watchman salary">
    <div class="row"><div><label>Paid To</label><input value="${esc(EF.payee)}" oninput="EF.payee=this.value"></div><div><label>Amount ₹</label><input inputmode="decimal" value="${esc(EF.amount)}" oninput="EF.amount=this.value"></div></div>
    <div class="row"><div><label>Mode</label><select onchange="EF.mode=this.value">${MODES.map(m => `<option ${m === EF.mode ? "selected" : ""}>${m}</option>`).join("")}</select></div><div><label>Bill / Voucher No.</label><input value="${esc(EF.ref)}" oninput="EF.ref=this.value"></div></div>
    ${photoField("EF")}
    <div class="row" style="margin-top:12px">${EF.id ? `<button class="btn" onclick="EF=newEF();render()">Cancel</button>` : ""}<button class="btn amb" onclick="saveExp()">${EF.id ? "Update" : "Save Expense"}</button></div></div>`;
  return form + `<div class="card"><h3>Society Expenses</h3>
    <div class="bar"><select style="width:auto" onchange="XF.m=this.value;render()"><option value="">All months</option>${ms.map(m => `<option value="${m}" ${m === XF.m ? "selected" : ""}>${ymL(m)}</option>`).join("")}</select>
    <select style="width:auto" onchange="XF.c=this.value;render()"><option value="">All categories</option>${cats().map(c => `<option ${c === XF.c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
    ${expTable(list, admin)}</div>`;
}
function saveExp() {
  const amt = +EF.amount;
  if (!EF.desc.trim()) return toast("Enter work / description");
  if (!(amt > 0)) return toast("Enter amount");
  if (!EF.date) return toast("Enter date");
  if (UPL) return toast("Wait — photo uploading");
  const rec = { id: EF.id || uid(), date: EF.date, cat: EF.cat, desc: EF.desc.trim(), payee: EF.payee.trim(), amount: amt, mode: EF.mode, ref: EF.ref.trim(), photo: EF.photo || "", ts: Date.now() };
  if (EF.id) { const old = D.expenses.find(e => e.id === EF.id); if (old.photo && old.photo !== rec.photo) dropPhoto(old.photo); }
  if (EF.id) Object.assign(D.expenses.find(e => e.id === EF.id), rec); else D.expenses.push(rec);
  const up = !!EF.id; EF = newEF(); commit(up ? "Expense updated" : "Expense saved");
}
function editExp(id) { const e = D.expenses.find(x => x.id === id); EF = { id, date: e.date, cat: e.cat, desc: e.desc, payee: e.payee || "", amount: String(e.amount), mode: e.mode, ref: e.ref || "", photo: e.photo || "" }; render(); window.scrollTo(0, 0); }
function delExp(id) { const e = D.expenses.find(x => x.id === id); ask(`Delete expense <b>${esc(e.desc)}</b> (${inr(e.amount)})?`, "Delete", () => { dropPhoto(e.photo); e.del = true; e.ts = Date.now(); commit("Deleted"); }, true); }

/* ----- Notices ----- */
let NF = null;
function newNF() { return { id: null, date: today(), title: "", body: "", pin: false, photo: "" }; }
const noticeList = () => L("notices").sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || sortDesc(a, b));
const seenKey = () => "socSeen_" + (S && S.flatId);
function unread() { let t = 0; try { t = +localStorage.getItem(seenKey()) || 0; } catch (e) {} return L("notices").filter(n => (n.ts || 0) > t).length; }
function noticeView() {
  const admin = S.role === "admin", list = noticeList();
  if (admin && !NF) NF = newNF();
  let h = admin ? `<div class="card"><h3>${NF.id ? "Edit Notice" : "New Notice / Circular"}</h3>
    <div class="row"><div style="flex:2"><label>Title</label><input value="${esc(NF.title)}" oninput="NF.title=this.value" placeholder="e.g. Water supply off on Sunday"></div><div><label>Date</label><input type="date" value="${NF.date}" onchange="NF.date=this.value"></div></div>
    <label>Message</label><textarea rows="4" oninput="NF.body=this.value">${esc(NF.body)}</textarea>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:auto" ${NF.pin ? "checked" : ""} onchange="NF.pin=this.checked"> 📌 Pin to top (important)</label>
    ${photoField("NF")}
    <div class="row" style="margin-top:12px">${NF.id ? `<button class="btn" onclick="NF=newNF();render()">Cancel</button>` : ""}<button class="btn amb" onclick="saveNotice()">${NF.id ? "Update" : "Post Notice"}</button></div></div>` : "";
  h += `<div class="card"><h3>Notice Board (${list.length})</h3>${list.length ? list.map(n => `<div style="border-top:1px solid #edf0f4;padding:8px 0">
      <div><b>${n.pin ? "📌 " : ""}${esc(n.title)}</b> <span class="muted small">${dL(n.date)}</span></div>
      <div style="white-space:pre-wrap;margin:4px 0">${esc(n.body)}</div>
      <div class="bar" style="margin:4px 0 0">${n.photo ? `<button class="btn sm" onclick="viewPhoto('${n.photo}')">📎 Photo</button>` : ""}
      ${admin ? `<button class="btn sm wa" onclick="waNotice('${n.id}')">WhatsApp</button><button class="btn sm" onclick="editNotice('${n.id}')">Edit</button><button class="btn sm red" onclick="delNotice('${n.id}')">✕</button>` : ""}</div></div>`).join("") : `<div class="muted">No notices yet.</div>`}</div>`;
  return h;
}
function saveNotice() {
  if (!NF.title.trim()) return toast("Enter title");
  if (UPL) return toast("Wait — photo uploading");
  const rec = { id: NF.id || uid(), date: NF.date || today(), title: NF.title.trim(), body: NF.body.trim(), pin: !!NF.pin, photo: NF.photo || "", ts: Date.now() };
  if (NF.id) { const old = D.notices.find(n => n.id === NF.id); if (old.photo && old.photo !== rec.photo) dropPhoto(old.photo); Object.assign(old, rec); }
  else D.notices.push(rec);
  const isNew = !NF.id; NF = newNF(); commit(isNew ? "Notice posted" : "Notice updated");
  if (isNew) ask("Notice posted. Also send it to the society WhatsApp group?", "Open WhatsApp", () => waNotice(rec.id));
}
function editNotice(id) { const n = D.notices.find(x => x.id === id); NF = { id, date: n.date, title: n.title, body: n.body, pin: !!n.pin, photo: n.photo || "" }; render(); window.scrollTo(0, 0); }
function delNotice(id) { const n = D.notices.find(x => x.id === id); ask(`Delete notice <b>${esc(n.title)}</b>?`, "Delete", () => { dropPhoto(n.photo); n.del = true; n.ts = Date.now(); commit("Deleted"); }, true); }
function waNotice(id) {
  const n = D.notices.find(x => x.id === id);
  window.open("https://wa.me/?text=" + encodeURIComponent(`*${D.settings.name}*\n📢 *NOTICE* — ${dL(n.date)}\n\n*${n.title}*\n${n.body}\n\n— Managing Committee`), "_blank");
}

/* ----- Dues (admin) ----- */
function duesView() {
  const rows = L("flats").sort(byNo).map(f => ({ f, d: duesOf(f) }));
  const pend = rows.filter(r => r.d.amount > 0);
  return `<div class="card"><h3>Pending Dues up to ${ymL(curYM())}</h3>
    <div class="muted small">${pend.length} of ${rows.length} flats pending · Total ${inr(pend.reduce((s, r) => s + r.d.amount, 0))}</div>
    <div class="tw" style="margin-top:8px"><table><thead><tr><th>Flat</th><th>Owner</th><th>Pending Months</th><th class="r">Amount</th><th></th></tr></thead><tbody>
    ${rows.map(({ f, d }) => `<tr><td><b>${esc(f.no)}</b></td><td>${esc(f.owner)}</td><td>${d.months.length ? `<span class="due">${d.months.length}</span> <span class="muted small">${d.months.map(ymL).join(", ")}</span>` : `<span class="ok">Clear</span>`}</td><td class="r">${d.amount ? inr(d.amount) : "—"}</td>
      <td class="r" style="white-space:nowrap">${d.amount && f.mobile ? `<button class="btn sm wa" onclick="waRemind('${f.id}')">Remind</button> ` : ""}${d.amount ? `<button class="btn sm" onclick="collectFor('${f.id}')">Collect</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function waRemind(id) {
  const f = flatById(id), d = duesOf(f);
  openWA(f.mobile, `*${D.settings.name}*\n\nDear ${f.owner} (Flat ${f.no}),\nGentle reminder: society maintenance is pending for ${d.months.map(ymL).join(", ")}.\nAmount due: *${inr(d.amount)}*\n\nPlease pay at the earliest. You can check society expenses and your payments in the app.\n\n— Managing Committee`);
}
function collectFor(id) { CF = newCF(); CF.flatId = id; CF.months = duesOf(flatById(id)).months; cfAuto(); setTab("collect"); }

/* ----- Flats (admin) ----- */
let FF = null;
function newFF() { return { id: null, no: "", owner: "", mobile: "", amt: L("flats")[0] ? String(L("flats")[0].amt) : "", start: D.settings.start || curYM(), pin: "" }; }
function flatsView() {
  if (!FF) FF = newFF();
  const fl = L("flats").sort(byNo);
  return `<div class="card"><h3>${FF.id ? "Edit Flat" : "Add Flat"}</h3>
    <div class="row"><div><label>Flat No.</label><input value="${esc(FF.no)}" oninput="FF.no=this.value" placeholder="A-101"></div><div><label>Monthly ₹</label><input inputmode="decimal" value="${esc(FF.amt)}" oninput="FF.amt=this.value"></div></div>
    <label>Owner Name</label><input value="${esc(FF.owner)}" oninput="FF.owner=this.value">
    <div class="row"><div><label>Mobile (WhatsApp)</label><input inputmode="tel" value="${esc(FF.mobile)}" oninput="FF.mobile=this.value"></div><div><label>Dues from month</label><input type="month" value="${FF.start}" onchange="FF.start=this.value"></div></div>
    <label>Owner PIN (blank = last 4 digits of mobile)</label><input inputmode="numeric" value="${esc(FF.pin)}" oninput="FF.pin=this.value">
    <div class="row" style="margin-top:12px">${FF.id ? `<button class="btn" onclick="FF=newFF();render()">Cancel</button>` : ""}<button class="btn amb" onclick="saveFlat()">${FF.id ? "Update" : "Add Flat"}</button></div></div>
    <div class="card"><h3>Quick add many flats</h3><div class="muted small">Type flat numbers separated by comma or new line. Owner names & mobiles can be edited after.</div>
    <textarea id="bulk" rows="2" placeholder="A-101, A-102, A-103, B-101"></textarea>
    <div class="row"><div><label>Monthly ₹ for all</label><input id="bulkamt" inputmode="decimal"></div><div style="display:flex;align-items:flex-end"><button class="btn pri" style="width:100%" onclick="bulkAdd()">Add All</button></div></div></div>
    <div class="card"><h3>Flats (${fl.length})</h3>${fl.length ? `<div class="tw"><table><thead><tr><th>Flat</th><th>Owner / Mobile</th><th class="r">Monthly</th><th>From</th><th></th></tr></thead><tbody>
    ${fl.map(f => `<tr><td><b>${esc(f.no)}</b></td><td>${esc(f.owner) || `<span class="muted">—</span>`}<br><span class="muted small">${esc(f.mobile)}</span></td><td class="r">${inr(f.amt)}</td><td>${ymL(f.start)}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" onclick="editFlat('${f.id}')">Edit</button> <button class="btn sm red" onclick="delFlat('${f.id}')">✕</button></td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="2">Monthly total</td><td class="r">${inr(fl.reduce((s, f) => s + (+f.amt || 0), 0))}</td><td colspan="2"></td></tr></tfoot></table></div>` : `<div class="muted">No flats yet.</div>`}</div>`;
}
function saveFlat() {
  const no = FF.no.trim();
  if (!no) return toast("Enter flat no.");
  if (L("flats").some(f => f.no.toLowerCase() === no.toLowerCase() && f.id !== FF.id)) return toast("Flat " + no + " already exists");
  if (!(+FF.amt >= 0) || FF.amt === "") return toast("Enter monthly amount");
  const rec = { id: FF.id || uid(), no, owner: FF.owner.trim(), mobile: FF.mobile.trim(), amt: +FF.amt, start: FF.start || curYM(), pin: FF.pin.trim(), ts: Date.now() };
  if (FF.id) Object.assign(D.flats.find(f => f.id === FF.id), rec); else D.flats.push(rec);
  const up = !!FF.id; FF = newFF(); commit(up ? "Flat updated" : "Flat added");
}
function bulkAdd() {
  const amt = +$("#bulkamt").value, names = $("#bulk").value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  if (!names.length) return toast("Type flat numbers");
  if (!(amt > 0)) return toast("Enter monthly amount");
  const have = new Set(L("flats").map(f => f.no.toLowerCase())); let n = 0;
  names.forEach(no => { if (!have.has(no.toLowerCase())) { D.flats.push({ id: uid(), no, owner: "", mobile: "", amt, start: D.settings.start || curYM(), pin: "", ts: Date.now() }); have.add(no.toLowerCase()); n++; } });
  commit(n + " flats added");
}
function editFlat(id) { const f = flatById(id); FF = { id, no: f.no, owner: f.owner, mobile: f.mobile, amt: String(f.amt), start: f.start, pin: f.pin || "" }; render(); window.scrollTo(0, 0); }
function delFlat(id) { const f = flatById(id), n = L("payments").filter(p => p.flatId === id).length; ask(`Delete flat <b>${esc(f.no)}</b>?${n ? `<br><br><span class="due">It has ${n} receipt(s). They stay in accounts but will show without a flat.</span>` : ""}`, "Delete", () => { f.del = true; f.ts = Date.now(); commit("Flat deleted"); }, true); }

/* ----- Reports ----- */
let RY = new Date().getFullYear();
function repView() {
  const admin = S.role === "admin", P = L("payments"), E = L("expenses");
  const years = new Set([new Date().getFullYear()]); [...P, ...E].forEach(x => x.date && years.add(+x.date.slice(0, 4)));
  let rows = "", ti = 0, te = 0;
  for (let i = 1; i <= 12; i++) {
    const ym = RY + "-" + String(i).padStart(2, "0");
    const a = sum(P.filter(p => (p.date || "").slice(0, 7) === ym)), b = sum(E.filter(e => (e.date || "").slice(0, 7) === ym));
    ti += a; te += b;
    if (a || b) rows += `<tr><td>${ymL(ym)}</td><td class="r ok">${inr(a)}</td><td class="r due">${inr(b)}</td><td class="r">${inr(a - b)}</td></tr>`;
  }
  const cm = {}; E.filter(e => (e.date || "").startsWith(RY + "")).forEach(e => cm[e.cat] = (cm[e.cat] || 0) + (+e.amount || 0));
  const ca = Object.entries(cm).sort((a, b) => b[1] - a[1]), cmax = ca.length ? ca[0][1] : 1;
  let h = `<div class="bar"><label style="margin:0">Year</label><select style="width:auto" onchange="RY=+this.value;render()">${[...years].sort().map(y => `<option ${y === RY ? "selected" : ""}>${y}</option>`).join("")}</select>
    <button class="btn sm" onclick="window.print()">🖨 Print / PDF</button>
    ${admin ? `<button class="btn sm" onclick="csvPay()">⬇ Receipts Excel</button><button class="btn sm" onclick="csvExp()">⬇ Expenses Excel</button>` : ""}</div>
    ${kpis()}
    <div class="card"><h3>Month-wise Income & Expense — ${RY}</h3>${rows ? `<div class="tw"><table><thead><tr><th>Month</th><th class="r">Collected</th><th class="r">Spent</th><th class="r">Net</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${inr(ti)}</td><td class="r">${inr(te)}</td><td class="r">${inr(ti - te)}</td></tr></tfoot></table></div>` : `<div class="muted">No entries in ${RY}.</div>`}</div>
    <div class="card"><h3>Where money was used — ${RY}</h3>${ca.length ? `<table><tbody>${ca.map(([c, v]) => `<tr><td style="width:45%">${esc(c)}<div class="cbar" style="width:${Math.max(3, v / cmax * 100)}%"></div></td><td class="r">${inr(v)}</td><td class="r muted small">${te ? Math.round(v / te * 100) : 0}%</td></tr>`).join("")}</tbody></table>` : `<div class="muted">No expenses in ${RY}.</div>`}</div>`;
  if (admin) {
    const fl = L("flats").sort(byNo);
    h += `<div class="card"><h3>Flat-wise Payment Chart — ${RY}</h3><div class="tw"><table><thead><tr><th>Flat</th>${MN.map(m => `<th>${m}</th>`).join("")}</tr></thead><tbody>
      ${fl.map(f => { const ps = paidSet(f.id), st = f.start || D.settings.start; return `<tr><td style="white-space:nowrap"><b>${esc(f.no)}</b></td>${MN.map((m, i) => { const ym = RY + "-" + String(i + 1).padStart(2, "0"); return `<td style="text-align:center">${ps.has(ym) ? `<span class="ok">✓</span>` : (ym >= st && ym <= curYM() ? `<span class="due">✗</span>` : `<span class="muted">·</span>`)}</td>`; }).join("")}</tr>`; }).join("")}
      </tbody></table></div></div>`;
  }
  return h;
}
function csvPay() {
  const r = [["Receipt", "Date", "Type", "Flat", "Owner", "Months", "Amount", "Mode", "Ref", "Note"]];
  L("payments").sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(p => { const f = flatById(p.flatId); r.push([p.rno, p.date, p.type === "O" ? "Other" : "Maintenance", f ? f.no : "", f ? f.owner : "", (p.months || []).map(ymL).join(" "), p.amount, p.mode, p.ref, p.note]); });
  downloadCSV("Society_Receipts_" + today() + ".csv", r);
}
function csvExp() {
  const r = [["Date", "Category", "Description", "Paid To", "Amount", "Mode", "Bill No"]];
  L("expenses").sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(e => r.push([e.date, e.cat, e.desc, e.payee, e.amount, e.mode, e.ref]));
  downloadCSV("Society_Expenses_" + today() + ".csv", r);
}

/* ----- Settings (admin) ----- */
function setView() {
  const s = D.settings;
  return `<div class="card"><h3>Society Details</h3>
    <label>Society Name</label><input id="s_name" value="${esc(s.name)}">
    <label>Address</label><input id="s_addr" value="${esc(s.address)}">
    <label>Registration No.</label><input id="s_reg" value="${esc(s.regNo)}">
    <div class="row"><div><label>Opening Balance ₹</label><input id="s_ob" inputmode="decimal" value="${esc(s.openingBalance)}"></div><div><label>Default dues start month</label><input id="s_st" type="month" value="${esc(s.start)}"></div></div>
    <label>Committee PIN</label><input id="s_pin" inputmode="numeric" value="${esc(s.adminPin)}">
    <label>Expense Categories (one per line)</label><textarea id="s_cats" rows="5">${esc(cats().join("\n"))}</textarea>
    <button class="btn amb big" onclick="saveSet()">Save Settings</button></div>
    <div class="card"><h3>Cloud & Backup</h3>
    <div class="small">${cloudOn() ? `☁️ Cloud on — project <b>${esc(FB.projectId)}</b>. All owners see the same data. Photos are stored in the <b>photos</b> collection.` : `📱 <b>Local mode.</b> Data is only on this phone. To share with all flat owners, set Firebase Project ID & API key at the top of the HTML file.`}</div>
    <div class="bar"><button class="btn sm" onclick="backup()">⬇ Download Backup</button><button class="btn sm" onclick="$('#rf').click()">⬆ Restore Backup</button><input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this)"></div>
    ${!L("flats").length ? `<div class="bar"><button class="btn sm" onclick="demo()">Load demo data (to try the app)</button></div>` : ""}
    <div class="bar"><button class="btn sm red" onclick="wipe()">Delete ALL data</button></div></div>`;
}
function saveSet() {
  const pin = $("#s_pin").value.trim();
  if (pin.length < 4) return toast("PIN must be at least 4 digits");
  Object.assign(D.settings, { name: $("#s_name").value.trim() || "Society", address: $("#s_addr").value.trim(), regNo: $("#s_reg").value.trim(), openingBalance: +$("#s_ob").value || 0, start: $("#s_st").value || curYM(), adminPin: pin, cats: $("#s_cats").value.split("\n").map(x => x.trim()).filter(Boolean), ts: Date.now() });
  commit("Settings saved");
}
function backup() { download("Society_Backup_" + today() + ".json", JSON.stringify(D), "application/json"); }
function restore(inp) {
  const file = inp.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const x = JSON.parse(r.result); if (!x.settings || !x.flats) throw 0; ask("Replace ALL current data with this backup?", "Restore", () => { D = merge(blank(), x); D.settings.ts = Date.now(); saveLocal(); render(); push(true); toast("Restored"); }, true); } catch (e) { toast("Not a valid backup file"); } };
  r.readAsText(file); inp.value = "";
}
function wipe() {
  ask(`This will delete all flats, receipts and expenses${cloudOn() ? " for <b>everyone</b>" : ""}.<br><br>Type committee PIN to confirm:<input id="wp" type="password" inputmode="numeric" style="margin-top:8px">`, "Delete Everything", () => {}, true);
  $("#ovok").onclick = () => { if ($("#wp").value !== String(D.settings.adminPin)) return toast("Wrong PIN"); closeOv(); const s = D.settings; D = blank(); D.settings = Object.assign(s, { ts: Date.now() }); saveLocal(); render(); push(true); toast("All data deleted"); };
}
function demo() {
  const y = new Date().getFullYear(), now = curYM(), start = monthsBetween((y - 1) + "-" + now.slice(5), now).slice(-6)[0];
  const names = ["Ramesh Deshmukh", "Sunita Patil", "Anil Wankhede", "Priya Joshi", "Vijay Thakre", "Meena Raut", "Sanjay Gawande", "Kavita Bhoyar"];
  const nos = ["A-101", "A-102", "A-201", "A-202", "B-101", "B-102", "B-201", "B-202"];
  D.settings.start = start; D.settings.openingBalance = 25000; D.settings.ts = Date.now();
  const ms = monthsBetween(start, now); let r = 0;
  nos.forEach((no, i) => {
    const f = { id: uid(), no, owner: names[i], mobile: "98" + String(22000000 + i * 1111).padStart(8, "0"), amt: 1500, start, pin: "", ts: Date.now() }; D.flats.push(f);
    const upto = ms.length - (i % 3);
    ms.slice(0, upto).forEach(m => D.payments.push({ id: uid(), rno: "R-" + String(++r).padStart(4, "0"), type: "M", flatId: f.id, months: [m], amount: 1500, date: m + "-0" + (3 + i % 6), mode: MODES[i % 4], ref: "", note: "", ts: Date.now() }));
  });
  ms.forEach(m => {
    D.expenses.push({ id: uid(), date: m + "-01", cat: "Watchman / Security", desc: "Watchman salary " + ymL(m), payee: "Ganesh (Watchman)", amount: 6000, mode: "Cash", ref: "", ts: Date.now() });
    D.expenses.push({ id: uid(), date: m + "-10", cat: "Electricity (Common)", desc: "Common area & pump electricity bill", payee: "MSEDCL", amount: 1850 + Math.round(Math.random() * 600), mode: "UPI", ref: "", ts: Date.now() });
    D.expenses.push({ id: uid(), date: m + "-05", cat: "Housekeeping / Cleaning", desc: "Staircase & parking cleaning", payee: "Lata Bai", amount: 2000, mode: "Cash", ref: "", ts: Date.now() });
  });
  D.expenses.push({ id: uid(), date: ms[1] + "-18", cat: "Repairs & Maintenance", desc: "Water tank cleaning & motor repair", payee: "Shree Plumbing Works", amount: 4200, mode: "UPI", ref: "B-118", ts: Date.now() });
  D.notices.push({ id: uid(), date: today(), title: "Water tank cleaning on Sunday", body: "Water supply will be off on Sunday from 10 AM to 2 PM for overhead tank cleaning. Please store water.", pin: true, photo: "", ts: Date.now() });
  D.notices.push({ id: uid(), date: today(), title: "General Body Meeting", body: "AGM on last Sunday of this month, 6 PM in the parking area. All owners please attend.", pin: false, photo: "", ts: Date.now() });
  commit("Demo data loaded — owner PIN = last 4 digits of mobile");
}

/* ---------- boot ---------- */
render();
if (cloudOn()) { refresh(false); setInterval(() => { if (!document.hidden) refresh(false); }, 60000); }
</script>
</body>
